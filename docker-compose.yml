version: '3.8'

services:
  app:
    build: .
    container_name: organic_ranking_app
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=organic_ranking
      - DB_USERNAME=organic_user
      - DB_PASSWORD=organic_pass
    depends_on:
      - db

  db:
    image: mariadb:10.11
    container_name: organic_ranking_db
    environment:
      MYSQL_DATABASE: organic_ranking
      MYSQL_USER: organic_user
      MYSQL_PASSWORD: organic_pass
      MYSQL_ROOT_PASSWORD: root_pass
    volumes:
      - organic_ranking_db_data:/var/lib/mysql

volumes:
  organic_ranking_db_data:
